<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OutreachLead — outreach mail</title>
<link rel="stylesheet" href="/styles.css?v=ol4">
<link rel="icon" href="/brand.svg?v=ol4" type="image/svg+xml">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="logo"><span class="mk">↗</span> OutreachLead</div>
    <div class="metrics">
      <div>queued <b id="m-queued">0</b></div>
      <div>sent <b id="m-sent">0</b></div>
      <div>today <b id="m-today">0</b></div>
      <div>replies <b id="m-replies">0</b></div>
    </div>
    <div class="push">
      <div class="runchip" id="runchip"><span class="pulse"></span><span id="runlabel">paused</span></div>
      <button class="topbtn ghost" id="btn-tick" title="Run the scheduler once, right now">Run now</button>
      <button class="topbtn" id="btn-run">Start</button>
    </div>
  </header>

  <div class="cols">
    <nav class="rail" id="rail">
      <div class="grp">Engage</div>
      <button data-view="campaigns" aria-current="true">Campaigns <span class="pill" id="t-camp">0</span></button>
      <button data-view="businesses">Businesses <span class="pill" id="t-biz">0</span></button>
      <button data-view="templates">Letters <span class="pill" id="t-tpl">0</span></button>
      <button data-view="sequences">Sequences <span class="pill" id="t-seq">0</span></button>
      <button data-view="newcampaign">＋ New campaign</button>
      <div class="grp">Mail</div>
      <button data-view="inbox">Master inbox <span class="pill" id="t-replies">0</span></button>
      <button data-view="outbox">Outbox <span class="pill" id="t-queued">0</span></button>
      <div class="grp">Performance</div>
      <button data-view="analytics">Analytics</button>
      <div class="grp">Account</div>
      <button data-view="senders">Sender accounts <span class="pill" id="t-senders">0</span></button>
      <button data-view="connectors">Connectors</button>
      <button data-view="settings">Setup</button>
      <button data-view="logs">Activity</button>
      <div class="railfoot">
        <div id="gmail-state"><span class="dot"></span> checking…</div>
        <div id="next-due"></div>
        <div>Private workspace</div>
      </div>
    </nav>

    <main class="pane" id="pane"><div class="wrap"><p class="lede">Loading…</p></div></main>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="sheet">
    <div class="sh"><h3 id="modal-title">…</h3><button class="btn sm" id="modal-x">Close</button></div>
    <div class="sb" id="modal-body"></div>
    <div class="sf" id="modal-foot"></div>
  </div>
</div>

<div id="toast"></div>

<script src="/app.js?v=ol4"></script>
<script src="/workflows.js?v=ol4"></script>
<script src="/saas.js?v=ol4"></script>
<script src="/lists.js?v=ol4"></script>
</body>
</html>
